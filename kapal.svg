<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">N1vervic</title>
  <desc id="d">Profile banner for N1vervic with a catamaran ASV floating on animated waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="1" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="sea1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa87f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b3d3a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="sea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0b3d3a" stop-opacity="0.90"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="260" rx="12"/></clipPath>
  </defs>
  <style>
    .name  { font: 800 56px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
    .sub   { font: 400 18px "Segoe UI", Helvetica, Arial, sans-serif; fill: #a7f3d0; }
    .tags  { font: 400 14px "Segoe UI", Helvetica, Arial, sans-serif; fill: #d1fae5; letter-spacing: 0.5px; }
    .accent { animation: grow 2.4s ease-out both; transform-box: fill-box; transform-origin: left; }
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 14s linear infinite reverse; }
    .boat  { animation: bob 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring  { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-450px); } }
    @keyframes bob   { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }
    @keyframes ping  { 0% { transform: scale(0.4); opacity: 0.9; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .accent, .wave1, .wave2, .boat, .ring { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <text class="name" x="44" y="100">N1vervic</text>
    <rect class="accent" x="46" y="114" width="150" height="4" rx="2" fill="#5eead4"/>
    <text class="sub"  x="44" y="150">Programming Division, Control Subdivision · Barunastra Internship 2026</text>
    <text class="tags" x="44" y="184">Python  ·  C++  ·  OpenCV  ·  learning autonomous vessel software</text>

    <g transform="translate(750 160)">
      <g class="boat">
        <line x1="0" y1="10" x2="0" y2="-14" stroke="#e5e7eb" stroke-width="2"/>
        <circle class="ring" cx="0" cy="-16" r="5" fill="none" stroke="#5eead4" stroke-width="2"/>
        <circle cx="0" cy="-16" r="4" fill="#5eead4"/>
        <rect x="-22" y="10" width="44" height="18" rx="3" fill="#e5e7eb"/>
        <rect x="-14" y="14" width="28" height="7" rx="2" fill="#0b1b3a"/>
        <rect x="-64" y="28" width="128" height="9" rx="3" fill="#cbd5e1"/>
        <path d="M-68 37 h46 l-7 16 h-34 z" fill="#f59e0b"/>
        <path d="M22 37 h46 l-5 16 h-34 z" fill="#f59e0b"/>
      </g>
    </g>

    <g class="wave1">
      <path fill="url(#sea1)" d="M0 206 q56.25 -16 112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 V260 H0 Z"/>
    </g>
    <g class="wave2">
      <path fill="url(#sea2)" d="M0 224 q56.25 -14 112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 t112.5 0 V260 H0 Z"/>
    </g>
  </g>
</svg>
