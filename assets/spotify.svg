<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 110" width="270" height="110" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">1000x by Ghea Indrawari on Spotify</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b3a"/>
      <stop offset="1" stop-color="#0f5132"/>
    </linearGradient>
  </defs>
  <style>
    .t  { font: 700 19px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .a  { font: 400 14px "Segoe UI", Helvetica, Arial, sans-serif; fill: #a7f3d0; }
    .p  { font: 600 11px "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: 0.3px; }
    .vinyl { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite; }
    .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes eq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { .vinyl, .bar { animation: none; } }
  </style>
  <rect width="270" height="110" rx="12" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="268.5" height="108.5" rx="11.5" fill="none" stroke="#1f7a5c" stroke-width="1.5"/>
  <g class="vinyl">
    <circle cx="54" cy="55" r="34" fill="#0a0f1c"/>
    <circle cx="54" cy="55" r="27" fill="none" stroke="#1f2a44" stroke-width="1.5"/>
    <circle cx="54" cy="55" r="20" fill="none" stroke="#1f2a44" stroke-width="1.5"/>
    <circle cx="54" cy="55" r="12" fill="#5eead4"/>
    <circle cx="54" cy="55" r="3" fill="#0a0f1c"/>
    <path d="M54 21 A34 34 0 0 1 82 38" fill="none" stroke="#5eead4" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text class="t" x="102" y="46">1000x</text>
  <text class="a" x="102" y="66">Ghea Indrawari</text>
  <rect x="102" y="76" width="112" height="22" rx="11" fill="#1db954"/>
  <circle cx="115" cy="87" r="4" fill="#ffffff"/>
  <text class="p" x="124" y="91">Play on Spotify</text>
  <g fill="#5eead4">
    <rect class="bar" x="234" y="76" width="5" height="22" rx="2"/>
    <rect class="bar b2" x="243" y="76" width="5" height="22" rx="2"/>
    <rect class="bar b3" x="252" y="76" width="5" height="22" rx="2"/>
  </g>
</svg>
